[project]
name = "browser-worlds-tinker-rl"
version = "0.1.0"
description = "Browser-agent RL on deterministic Browser Use Worlds with Tinker"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "chz>=0.4.0",
  "tinker-cookbook[modal] @ git+https://github.com/thinking-machines-lab/tinker-cookbook.git@2a7427c24a433b7dba8309c246bf5ce4f2420837",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
]

[project.scripts]
browser-rl = "browser_rl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

